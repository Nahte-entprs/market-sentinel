title: Centinela
views:
  - title: Resumen
    path: resumen
    icon: mdi:radar
    cards:
      - type: markdown
        content: >
          Radar local. No es consejo financiero. IDs de entidad según MQTT de este HA.

      - type: entity
        entity: sensor.centinela_regimen
        name: Régimen

      - type: entity
        entity: sensor.centinela_ultima_alerta
        name: Última alerta

      - type: markdown
        content: |
          ### WHY
          {% set why = state_attr('sensor.centinela_ultima_alerta', 'friendly_why') %}
          {% if why %}
          {% for w in why %}
          ✓ {{ w }}
          {% endfor %}
          {% else %}
          Sin eventos materiales sobre el umbral.
          {% endif %}

      - type: markdown
        content: |
          ### Emergentes (solo tickers, por sub)
          {% set a = state_attr('sensor.centinela_reddit_wsb', 'emerging_by_sub') or [] %}
          {% set b = state_attr('sensor.centinela_reddit_subs', 'emerging_by_sub') or [] %}
          {% set blocks = a + b %}
          {% if blocks | length == 0 %}Sin emergentes aún. Corre WSB daily / Reddit subs.{% endif %}
          {% for b in blocks %}
          **r/{{ b.sub }}**
          {% for t in b.tickers %}
          `{{ t.ticker }}` · {{ t.comments }} cmt{% if t.ratio7d %} · ×{{ t.ratio7d | round(1) }}{% endif %}
          {% endfor %}

          {% endfor %}

      - type: markdown
        content: |
          WSB: {{ states('sensor.centinela_reddit_wsb') }}

          Otros: {{ states('sensor.centinela_reddit_subs') }}

      - type: markdown
        content: |
          ### Briefing
          {{ state_attr('sensor.centinela_briefing', 'text') or states('sensor.centinela_briefing') }}

      - type: entities
        title: Watchlist
        entities:
          - entity: text.centinela_nuevo_ticker
          - entity: button.centinela_anadir_ticker

      - type: markdown
        content: |
          {% set ticks = state_attr('sensor.centinela_watchlist', 'tickers') or [] %}
          {{ ticks | join(' · ') }}

      - type: entities
        title: Tareas
        entities:
          - entity: sensor.centinela_tarea_reddit_rising
          - entity: button.centinela_run_reddit_rising
          - entity: sensor.centinela_job_reddit_subs
          - entity: button.centinela_run_reddit_subs
          - entity: sensor.centinela_tarea_macro_scan
          - entity: button.centinela_run_macro_scan
          - entity: sensor.centinela_tarea_quotes_poll
          - entity: button.centinela_run_quotes_poll

  - title: Reddit
    path: reddit
    icon: mdi:reddit
    cards:
      - type: markdown
        content: |
          ## r/wallstreetbets

          {{ state_attr('sensor.centinela_reddit_wsb', 'thread') or 'Sin hilo aún. Run WSB daily.' }}

          {% set s = state_attr('sensor.centinela_reddit_wsb', 'sentiment') or {} %}
          Léxico (no sarcasmo): **{{ s.bull | default(0) }}** bull /
          **{{ s.bear | default(0) }}** bear /
          {{ s.unlabeled | default(0) }} sin marca.

          _{{ s.note | default('') }}_

      - type: markdown
        content: |
          ### Emergentes (solo tickers)
          {% set blocks = state_attr('sensor.centinela_reddit_wsb', 'emerging_by_sub') or [] %}
          {% if blocks | length == 0 %}Ningún ticker en pico en este sub.{% endif %}
          {% for b in blocks %}
          **r/{{ b.sub }}**
          {% for t in b.tickers %}
          `{{ t.ticker }}` · {{ t.comments }} cmt · {{ t.variants }} únicos{% if t.ratio7d %} · ×{{ t.ratio7d | round(1) }}{% endif %}
          {% endfor %}
          {% endfor %}

      - type: markdown
        content: |
          ### Comentarios retenidos (filtro barato, no “joyas”)
          {% set qs = state_attr('sensor.centinela_reddit_wsb', 'quotes') or [] %}
          {% if qs | length == 0 %}Nada con flag ok y texto largo.{% endif %}
          {% for q in qs %}
          **{{ q.ticker }}** · score {{ q.score }}

          {{ q.body }}

          {% endfor %}

      - type: entities
        entities:
          - entity: sensor.centinela_tarea_reddit_rising
          - entity: button.centinela_run_reddit_rising

      - type: markdown
        content: |
          ---

          ## Otros subs

          {{ state_attr('sensor.centinela_reddit_subs', 'thread') or 'stocks, pennystocks, investing…' }}

          {% set s = state_attr('sensor.centinela_reddit_subs', 'sentiment') or {} %}
          Léxico (no sarcasmo): **{{ s.bull | default(0) }}** bull /
          **{{ s.bear | default(0) }}** bear /
          {{ s.unlabeled | default(0) }} sin marca.

      - type: markdown
        content: |
          ### Emergentes por subreddit (solo tickers)
          {% set blocks = state_attr('sensor.centinela_reddit_subs', 'emerging_by_sub') or [] %}
          {% if blocks | length == 0 %}Ningún ticker en pico en estos subs.{% endif %}
          {% for b in blocks %}
          **r/{{ b.sub }}**
          {% for t in b.tickers %}
          `{{ t.ticker }}` · {{ t.comments }} cmt · {{ t.variants }} únicos{% if t.ratio7d %} · ×{{ t.ratio7d | round(1) }}{% endif %}
          {% endfor %}

          {% endfor %}

      - type: markdown
        content: |
          ### Comentarios retenidos
          {% set qs = state_attr('sensor.centinela_reddit_subs', 'quotes') or [] %}
          {% if qs | length == 0 %}Nada con flag ok y texto largo.{% endif %}
          {% for q in qs %}
          **{{ q.ticker }}** · r/{{ q.sub }} · score {{ q.score }}

          {{ q.body }}

          {% endfor %}

      - type: entities
        entities:
          - entity: sensor.centinela_job_reddit_subs
          - entity: button.centinela_run_reddit_subs

  - title: Ideas
    path: ideas
    icon: mdi:lightbulb-outline
    cards:
      - type: markdown
        content: |
          Hipótesis que tú cargas. Centinela las irá contrastando con el tiempo.

          {% set ideas = state_attr('sensor.centinela_ideas_de_mercado', 'ideas') or [] %}
          {% if ideas | length == 0 %}Aún no hay ideas.{% endif %}
          {% for i in ideas %}
          **{{ i.title }}** — `{{ i.verdict }}`

          {{ i.claim }}
          {% endfor %}

      - type: entities
        title: Nueva idea
        entities:
          - entity: text.centinela_idea_titulo
          - entity: text.centinela_idea_claim
          - entity: select.centinela_idea_factor
          - entity: button.centinela_anadir_idea

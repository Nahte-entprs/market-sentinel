title: Centinela
views:
  - title: Radar
    path: radar
    icon: mdi:radar
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              **Mushroom + auto-entities.** Instala [Mushroom](https://github.com/piitaya/lovelace-mushroom)
              y [auto-entities](https://github.com/thomasloven/lovelace-auto-entities) vía HACS.
              Tickers: pestaña **Cartera**.

          - type: custom:mushroom-template-card
            primary: "Régimen {{ states('sensor.centinela_regime') }}"
            secondary: "Umbral dinámico · no es consejo financiero"
            icon: mdi:radar
            icon_color: >
              {% set r = states('sensor.centinela_regime') %}
              {% if r == 'CRISIS' %} red
              {% elif r == 'HIGH ALERT' %} orange
              {% elif r == 'WATCH' %} amber
              {% else %} green {% endif %}

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.centinela_last_alert') }}"
            secondary: >
              Score {{ state_attr('sensor.centinela_last_alert', 'score') }} ·
              {{ state_attr('sensor.centinela_last_alert', 'confidence') }}%
            icon: mdi:alert-decagram
            icon_color: red
            tap_action:
              action: more-info
            entity: sensor.centinela_last_alert

          - type: markdown
            content: |
              ### WHY
              {% set why = state_attr('sensor.centinela_last_alert', 'friendly_why') %}
              {% if why %}
              {% for w in why %}
              ✓ {{ w }}
              {% endfor %}
              {% else %}
              Sin eventos materiales sobre el umbral.
              {% endif %}

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Cartera
          - type: markdown
            content: >
              Holding / Priority / Watchlist están en la pestaña **Cartera**.
              {% set n = states('sensor.centinela_watchlist') %}
              {{ n }} tickers en radar.

          - type: custom:mushroom-title-card
            title: Ideas de mercado
          - type: markdown
            content: |
              {% set ideas = state_attr('sensor.centinela_ideas', 'ideas') or [] %}
              {% for i in ideas %}
              **{{ i.title }}** — `{{ i.verdict }}`
              {{ i.claim }}
              {% endfor %}
              {% if ideas | length == 0 %}Aún no hay ideas. Añade una hipótesis corta.{% endif %}
          - type: entities
            entities:
              - entity: text.centinela_idea_titulo
              - entity: text.centinela_idea_claim
              - entity: select.centinela_idea_factor
              - entity: button.centinela_add_idea

          - type: custom:mushroom-title-card
            title: Tareas
          - type: entities
            entities:
              - entity: sensor.centinela_job_macro_scan
              - entity: button.centinela_run_macro_scan
              - entity: sensor.centinela_job_ticker_events
              - entity: button.centinela_run_ticker_events
              - entity: sensor.centinela_job_market_sentiment
              - entity: button.centinela_run_market_sentiment
              - entity: sensor.centinela_job_volume_unusual
              - entity: button.centinela_run_volume_unusual
              - entity: sensor.centinela_job_reddit_rising
              - entity: button.centinela_run_reddit_rising
              - entity: sensor.centinela_job_reddit_subs
              - entity: button.centinela_run_reddit_subs
              - entity: sensor.centinela_job_ideas_eval
              - entity: button.centinela_run_ideas_eval
              - entity: sensor.centinela_job_fundamentals_poll
              - entity: button.centinela_run_fundamentals_poll

          - type: markdown
            content: |
              ### Reddit emergentes
              {% set em = state_attr('sensor.centinela_reddit_emerging', 'tickers') or [] %}
              {% if em | length == 0 %}Sin pico vs su propia media 7d.{% endif %}
              {% for e in em %}
              **{{ e.ticker }}** · {{ e.comments }} cmt · {{ e.subs | join(', ') }}
              {% endfor %}

          - type: markdown
            content: |
              ### Briefing
              {{ state_attr('sensor.centinela_digest', 'text') or states('sensor.centinela_digest') }}

  - title: Cartera
    path: cartera
    icon: mdi:briefcase-variant-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              No es consejo financiero. Fair lo cargas tú; rating y PT vienen de Yahoo.
              Fair en positivo: el precio está por encima de tu valor justo.
              Ritmo: volumen de hoy contra lo normal a esta hora. 5m: la última vela contra esa misma hora.

          - type: custom:mushroom-title-card
            title: Holding
            subtitle: Orden por valor de mercado (acciones × precio)

          - type: markdown
            content: >
              {% set n = states('sensor.centinela_holding') %}
              {% if n in ['unknown', 'unavailable', '0', ''] %}Sin holdings.{% endif %}

          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              template: |
                {% for t in state_attr('sensor.centinela_holding', 'positions') or [] %}
                {{
                  {
                    'type': 'custom:mushroom-template-card',
                    'primary': t.symbol ~ '  ' ~ t.price_fmt ~ '  ' ~ t.change_fmt,
                    'secondary': t.line2 ~ '\n' ~ t.line3,
                    'multiline_secondary': true,
                    'icon': 'mdi:briefcase-outline',
                    'icon_color': t.icon_color,
                    'badge_icon': t.badge_icon,
                    'badge_color': t.badge_color,
                    'entity': 'sensor.centinela_holding'
                  }
                }},
                {%- endfor %}

          - type: custom:mushroom-title-card
            title: Priority
            subtitle: Corto plazo · orden manual

          - type: markdown
            content: >
              {% set n = states('sensor.centinela_priority') %}
              {% if n in ['unknown', 'unavailable', '0', ''] %}Sin priority.{% endif %}

          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              template: |
                {% for t in state_attr('sensor.centinela_priority', 'positions') or [] %}
                {{
                  {
                    'type': 'custom:mushroom-template-card',
                    'primary': t.symbol ~ '  ' ~ t.price_fmt ~ '  ' ~ t.change_fmt,
                    'secondary': t.line2 ~ '\n' ~ t.line3,
                    'multiline_secondary': true,
                    'icon': 'mdi:star-four-points',
                    'icon_color': t.icon_color,
                    'badge_icon': t.badge_icon,
                    'badge_color': t.badge_color,
                    'entity': 'sensor.centinela_priority'
                  }
                }},
                {%- endfor %}

          - type: custom:mushroom-title-card
            title: Watchlist
            subtitle: Orden manual

          - type: markdown
            content: >
              {% set n = states('sensor.centinela_watch') %}
              {% if n in ['unknown', 'unavailable', '0', ''] %}Sin watchlist.{% endif %}

          - type: custom:auto-entities
            show_empty: false
            card:
              type: vertical-stack
            card_param: cards
            filter:
              template: |
                {% for t in state_attr('sensor.centinela_watch', 'positions') or [] %}
                {{
                  {
                    'type': 'custom:mushroom-template-card',
                    'primary': t.symbol ~ '  ' ~ t.price_fmt ~ '  ' ~ t.change_fmt,
                    'secondary': t.line2 ~ '\n' ~ t.line3,
                    'multiline_secondary': true,
                    'icon': 'mdi:eye-outline',
                    'icon_color': t.icon_color,
                    'badge_icon': t.badge_icon,
                    'badge_color': t.badge_color,
                    'entity': 'sensor.centinela_watch'
                  }
                }},
                {%- endfor %}

          - type: custom:mushroom-title-card
            title: Gestionar
            subtitle: Escribe un ticker existente para rellenar

          - type: markdown
            content: >
              **Guardar** añade o actualiza lista, cantidad de acciones y fair.
              El valor es acciones × precio. Subir y bajar solo aplican a Priority y Watchlist.

          - type: entities
            entities:
              - entity: text.centinela_nuevo_ticker
              - entity: select.centinela_ticker_categoria
              - entity: number.centinela_acciones
              - entity: number.centinela_fair_price
              - entity: button.centinela_save_ticker
              - entity: button.centinela_remove_ticker
              - entity: button.centinela_ticker_up
              - entity: button.centinela_ticker_down

# Paquete Home Assistant — copiar a /config/packages/centinela.yaml
# En configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Camino de avisos:
#   Centinela publica MQTT centinela/notify
#   → esta automation llama solo a notify.mobile_app_ethan_s_x6
#   → el toque abre el panel ingress en la pestaña del aviso.
#
# No uses "Ejecutar acción": no hay mensaje MQTT, y trigger no existe.
# Prueba con el botón Enviar aviso de Centinela, o publicando en centinela/notify.
#
# Panel real en este HA (barra lateral): /2e00f8dc_centinela?tab=<sección>

automation:
  - id: centinela_notify_companion
    alias: "Centinela → Companion"
    mode: queued
    max: 40
    trigger:
      - platform: mqtt
        topic: centinela/notify
    variables:
      panel: "/2e00f8dc_centinela?tab={{ trigger.payload_json.section | default('radar') }}"
    action:
      - service: notify.mobile_app_ethan_s_x6
        data:
          title: "{{ trigger.payload_json.title }}"
          message: "{{ trigger.payload_json.message }}"
          data:
            url: "{{ panel }}"
            clickAction: "{{ panel }}"
            ttl: 0
            priority: high
            tag: "centinela-{{ now().timestamp() | int }}-{{ range(1000) | random }}"
            group: "centinela-{{ trigger.payload_json.section | default('radar') }}"
            actions:
              - action: URI
                title: Abrir
                uri: "{{ panel }}"

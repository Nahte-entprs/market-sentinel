# Paquete Home Assistant — copiar a /config/packages/centinela.yaml
# En configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Camino de avisos:
#   Centinela publica MQTT centinela/notify (sección radar|cartera|reddit|ideas)
#   → esta automation llama notify.notify (Companion)
#   → el toque abre el panel ingress en la pestaña correcta.
#
# El puente HA es necesario: Companion no lee MQTT del add-on; se registra
# como servicio notify.* en Home Assistant.
#
# Si el add-on no es "local" (instalado desde GitHub), cambia ADDON_SLUG
# a algo como xxxxx_centinela (Ajustes → Complementos → Centinela → la URL
# de ingress muestra el slug).

automation:
  - id: centinela_notify_companion
    alias: "Centinela → Companion"
    mode: queued
    max: 12
    trigger:
      - platform: mqtt
        topic: centinela/notify
    variables:
      addon_slug: local_centinela
      section: "{{ trigger.payload_json.section | default('radar') }}"
      panel: "/hassio/ingress/{{ addon_slug }}?tab={{ section }}"
    action:
      - service: notify.notify
        data:
          title: "{{ trigger.payload_json.title }}"
          message: >
            {{ trigger.payload_json.message }}
          data:
            url: "{{ panel }}"
            clickAction: "{{ panel }}"
            ttl: 0
            priority: high
            tag: "centinela-{{ section }}"
            group: "centinela-{{ section }}"
            actions:
              - action: URI
                title: Abrir
                uri: "{{ panel }}"
